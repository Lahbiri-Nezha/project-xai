# Stack locale de demo pour Sales Insight :
#   db (PostgreSQL 16) + minio (stockage S3 des exports) + app (image standalone)
#
# Lancement :
#   1. docker compose up -d db minio            # infra
#   2. npx prisma migrate deploy && npx prisma db seed   (depuis l'hote, DATABASE_URL sur localhost:5432)
#   3. docker compose up -d app                 # application sur http://localhost:3000
#
# En cas d'indisponibilite de MinIO, l'app bascule automatiquement sur le
# telechargement Blob local (src/lib/export-storage.ts).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_insight
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_insight"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/sales-exports &&
      mc anonymous set download local/sales-exports
      "

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/sales_insight
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sales_insight
      BETTER_AUTH_SECRET: compose-dev-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INNGEST_DEV: "1"
      S3_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: sales-exports
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/sales-exports
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
