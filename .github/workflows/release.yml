name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publier l'image Docker sur GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image (minuscules pour GHCR)
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.ref_name }}
            ${{ steps.img.outputs.image }}:latest
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@db:5432/sales_insight

      - name: Resume
        run: |
          echo "Image publiee :"
          echo "  ghcr.io/${GITHUB_REPOSITORY@L}:${{ github.ref_name }}"
          echo "  ghcr.io/${GITHUB_REPOSITORY@L}:latest"
